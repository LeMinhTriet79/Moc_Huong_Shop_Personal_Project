server:
  port: 8080

management:
  tracing:
    sampling:
      probability: 1.0

spring:
  application:
    name: api-gateway
  zipkin:
    base-url: http://localhost:9411
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:4200"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600
      routes:
        # 1. Định tuyến chuẩn của từng Service
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/identity/**

        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**

        # 2. Định tuyến Alias tiện lợi cho Frontend
        - id: auth-alias
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/identity/auth/${segment}

        - id: products-alias
          uri: lb://catalog-service
          predicates:
            - Path=/api/products/**
          filters:
            - RewritePath=/api/products/(?<segment>.*), /api/catalog/products/${segment}

        - id: orders-alias
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders/(?<segment>.*), /api/order/orders/${segment}

        # 3. Định tuyến gom file cấu hình Swagger
        - id: openapi-identity
          uri: lb://identity-service
          predicates:
            - Path=/v3/api-docs/identity
          filters:
            - RewritePath=/v3/api-docs/identity, /v3/api-docs

        - id: openapi-catalog
          uri: lb://catalog-service
          predicates:
            - Path=/v3/api-docs/catalog
          filters:
            - RewritePath=/v3/api-docs/catalog, /v3/api-docs

        - id: openapi-order
          uri: lb://order-service
          predicates:
            - Path=/v3/api-docs/order
          filters:
            - RewritePath=/v3/api-docs/order, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    urls:
      - name: 1. Phân hệ Tài khoản (Identity)
        url: /v3/api-docs/identity
      - name: 2. Phân hệ Sản phẩm (Catalog)
        url: /v3/api-docs/catalog
      - name: 3. Phân hệ Đặt hàng (Order)
        url: /v3/api-docs/order