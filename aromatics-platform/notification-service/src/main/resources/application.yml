server:
  port: 8084

management:
  tracing:
    sampling:
      probability: 1.0 # 1.0 nghĩa là ghi hình 100% các request (để test)
spring:
  zipkin:
    base-url: http://localhost:9411
  application:
    name: notification-service

  # Cấu hình kết nối MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/notification_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 12345

  # Cấu hình JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect

  # Cấu hình Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Cấu hình Kafka Consumer
  # Cấu hình Kafka Consumer
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Đổi sang v3 để bỏ qua cái tin nhắn lỗi đang bị kẹt
      group-id: notification-group-v3
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.HashMap
        # BÍ QUYẾT GIẢI QUYẾT LỖI CLASS NOT FOUND: Phớt lờ nhãn mác của bên gửi
        spring.json.use.type.headers: false
    listener:
      observation-enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: "letriet22042004@gmail.com"
    password: "fzctnhjqphtvudbw"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

